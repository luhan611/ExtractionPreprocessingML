[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lnp-preprocess"
version = "0.1.0"
description = "Source-preserving document preparation and evidence tools for LNP papers"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber==0.11.9",
  "pypdfium2==5.14.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
]

[project.scripts]
lnp-preprocess = "lnp_preprocess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
